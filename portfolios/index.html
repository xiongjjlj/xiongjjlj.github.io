<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#edeae3"><title>作品集阅览室 · Fei Xiong</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a href="/" class="brand">FEI XIONG <span> / 作品集阅览室</span></a><div class="private">个人收藏</div></header>
<main id="library" hidden><section class="intro"><div><p class="kicker">ARCHITECTURE, BETWEEN FRIENDS</p><h1>翻开那些年的作品集。</h1><p class="lead">同济、延长线、朋友与前辈留下的设计记录。<br>从封面开始，一页一页地读。</p></div><div class="stat"><strong id="total">—</strong><span>份作品与分享</span><small id="pagesTotal"></small></div></section>
<div class="continue" id="continue" hidden></div><section class="controls"><div class="searchline"><label class="search"><span>⌕</span><input id="search" placeholder="找名字、学校、作品或原文件名" aria-label="搜索作品集"><kbd>/</kbd></label><button id="favoriteFilter" aria-pressed="false">♡ 收藏</button><select id="sort" aria-label="排序"><option value="curated">按原收藏分组</option><option value="name">按名称</option><option value="pages">页数从多到少</option></select></div><div class="filters" id="filters"></div></section><div class="resultbar"><span id="resultCount"></span><span>点击封面，直接翻阅</span></div><section id="grid" class="grid" aria-live="polite"></section><p id="empty" hidden>没有找到匹配的作品，试试名字、学校或原文件编号。</p><footer>整理自老电脑上的原始收藏 · 部分名称根据封面识别，阅读器内保留原文件名。<br>仅收录非 Issuu 资料；原文件保留在老 Windows。</footer></main>
<section id="gate" class="gate"><p class="kicker">FEI XIONG / READING ROOM</p><h1>作品集阅览室</h1><p id="gateText">正在打开收藏…</p><form id="unlock" hidden><label>访问码<input id="keyInput" autocomplete="off" type="password" placeholder="粘贴阅览链接或访问码" required></label><button type="submit">打开阅览室 →</button></form></section>
<dialog id="reader"><div class="readerbar"><button id="close" aria-label="返回收藏">← 返回</button><div class="booktitle"><strong id="bookTitle"></strong><span id="bookGroup"></span></div><button id="star" aria-label="收藏作品">♡</button><button id="infoToggle" aria-label="原文件信息">ⓘ</button></div><div id="info" hidden></div><div class="readerbody"><aside id="thumbs" aria-label="页面缩略导航"></aside><div class="viewport" id="viewport"><div class="paper" id="paper"><img id="pageImage" alt="作品集页面"><div id="pageStatus" role="status"></div></div></div></div><div class="readerbottom"><button id="prev" aria-label="上一页">←</button><label><input id="pageNo" type="number" min="1" aria-label="页码"> <span id="pageOf"></span></label><button id="next" aria-label="下一页">→</button><div class="divider"></div><select id="zoom" aria-label="缩放"><option value="fit">适应屏幕</option><option value="width">适应宽度</option><option value="150">150%</option><option value="200">200%</option></select><button id="openImage">查看大图 ↗</button><span class="hint">← → 翻页 · Esc 返回</span></div></dialog>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
